name: Secret Probe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe secrets
        env:
          AU: ${{ secrets.ALIYUN_USERNAME }}
          AP: ${{ secrets.ALIYUN_PASSWORD }}
          KH: ${{ secrets.K3S_HOST }}
          KP: ${{ secrets.K3S_PORT }}
          KU: ${{ secrets.K3S_USER }}
          KK: ${{ secrets.K3S_SSH_KEY }}
          VU: ${{ vars.ALIYUN_USERNAME }}
          VP: ${{ vars.ALIYUN_PASSWORD }}
        run: |
          for pair in "ALIYUN_USERNAME=$AU" "ALIYUN_PASSWORD=$AP" "K3S_HOST=$KH" "K3S_PORT=$KP" "K3S_USER=$KU" "K3S_SSH_KEY=$KK"; do
            n=${pair%%=*}; v=${pair#*=}
            if [ -z "$v" ]; then
              echo "::warning title=MISSING-$n::not found in Repository secrets"
            else
              echo "::notice title=PRESENT-$n::found length ${#v}"
            fi
          done
          [ -n "$VU" ] && echo "::warning title=IN-VARIABLES-ALIYUN_USERNAME::configured as Variable not Secret"
          [ -n "$VP" ] && echo "::warning title=IN-VARIABLES-ALIYUN_PASSWORD::configured as Variable not Secret"
          exit 0
