name: Build Image Artifact

# No-secrets side channel: build the image in GitHub CI and publish it as a
# Release asset, so the image can be delivered before ACR secrets exist.
# release.yml stays the canonical pipeline.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t wuhan-miniature:${{ github.ref_name }} .
      - name: Export tarball
        run: docker save wuhan-miniature:${{ github.ref_name }} | gzip -9 > wuhan-miniature-${{ github.ref_name }}.tar.gz
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          files: wuhan-miniature-${{ github.ref_name }}.tar.gz
