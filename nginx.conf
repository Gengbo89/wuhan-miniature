# 江城小境 —— nginx 站点配置
#
# 三件事：正确的内容类型、给大文件开 gzip、静态资源分层缓存。
# 本站没有后端、没有 SPA 路由，所以不需要 try_files 回退到首页，
# 404 就让它是真的 404（缺文件时能立刻发现，而不是伪装成首页）。
#
# 下面三处写法都是实测校正过的，注释里记了改之前的行为，避免以后被"简化"回去：
#   1. location ^~ /vendor/ 的 ^~ 不能去掉
#   2. /healthz 用 default_type 指定类型，不能用 add_header Content-Type
#   3. 缓存只用 add_header Cache-Control，不能和 expires 同时用

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # k8s 探针用的轻量端点：不写访问日志、不碰磁盘。
    #
    # 类型必须用 default_type 声明：`return 200 "ok\n"` 自带的类型是
    # application/octet-stream，而 add_header 是"追加"语义，会变成两个
    # Content-Type（实测：octet-stream + text/plain 同时出现）。
    # default_type 是"替换"语义，只出一个头。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # three.js 两个文件合计约 2MB，是首屏最大的传输项。
    # 实测 gzip 后 three.core.js 从 1,403,455 字节降到 278,598 字节（约 5:1）。
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # vendor/ 是 three.js 官方发行版，随版本号变化而不是随站点变化：
    # 长缓存能省掉重复下载 2MB。
    #
    # ^~ 是必须的：普通前缀 location 会输给下面的正则 location，
    # 实测去掉 ^~ 之后 /vendor/three.core.js 命中的是 1 小时那条规则，
    # 30 天长缓存形同虚设。
    location ^~ /vendor/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # 站点自身代码：短缓存 + 强制回源校验，兼顾"不重复下载"和"改了就生效"。
    #
    # 这里不再用 expires：expires 自己会发一个 Cache-Control: max-age=3600，
    # 再配一条 add_header 就变成两个 Cache-Control（实测确实出现两个）。
    # 只用 add_header 表达，头是唯一的，语义也更明确。
    location ~* \.(?:js|css|svg)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 站点是纯静态内容，关掉不需要的动静
    autoindex off;
}