# 江城小境 —— nginx 站点配置
#
# 三件事：正确的内容类型、给大文件开 gzip、静态资源长缓存。
# 本站没有后端、没有 SPA 路由，所以不需要 try_files 回退，
# 404 就让它是真的 404（缺文件时能立刻发现，而不是伪装成首页）。

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # k8s 探针用的轻量端点：不写访问日志、不碰磁盘
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # three.js 两个文件合计 2MB，是首屏最大的传输项。
    # gzip 后约 350KB，压缩率约 6:1，是本站最值得压的东西。
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # vendor/ 是 three.js 官方发行版，随版本号变化而不是随站点变化：
    # 长缓存能省掉重复下载 2MB。我们自己改的 js/ 不这样缓存，
    # 避免"更新了代码但用户拿到旧文件"。
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 站点自身代码：短缓存 + 强制回源校验，兼顾"不重复下载"和"改了就生效"
    location ~* \.(?:js|css|svg)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 站点是纯静态内容，关掉不需要的动静
    autoindex off;
}